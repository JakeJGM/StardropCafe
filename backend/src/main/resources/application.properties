spring.application.name=StardropCafe

# Origin patterns allowed to call this API from a browser (comma-separated).
# `*` suits local development; restrict it for any public deployment.
stardropcafe.cors.allowed-origin-patterns=*

# Docker Compose support (spring-boot-docker-compose) is only used with the postgres profile.
spring.docker.compose.enabled=false

# Postgres: activate with SPRING_PROFILES_ACTIVE=postgres. Without it, the app uses in-memory H2.
# Connection settings come from DB_URL, DB_USERNAME and DB_PASSWORD.
# Note: the lines directly around "#---" must not be comments, or Spring misreads the file.

#---
spring.config.activate.on-profile=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stardrop}
spring.datasource.username=${DB_USERNAME:stardrop}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.docker.compose.enabled=true
