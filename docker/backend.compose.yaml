# Runs the published backend image with Postgres; needs only this file and a .env, not the source code.
#   docker compose -f backend.compose.yaml up -d
# Values come from a .env file next to this one (copy .env.backend.example to .env).
# For local development, see backend/compose.yaml.

# Separate project name so deployed containers and volumes never collide with the dev stack.
name: stardropcafe

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    # No published port: the backend reaches it as db:5432 on Compose's internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Always pulls the newest image from GHCR on `up`, even if an older copy exists locally.
    image: ghcr.io/jakejgm/stardropcafe-backend:latest
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      STARDROPCAFE_CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
