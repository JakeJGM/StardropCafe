# Lints and type-checks the web client, then builds its image and pushes it to GHCR, where docker/compose.yaml pulls it from.
# Pull requests run the same checks and build but never push, so a broken image can't be published.
name: Web image

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docker/web.Dockerfile'
      - '.github/workflows/web-image.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'docker/web.Dockerfile'
      - '.github/workflows/web-image.yml'
  # Adds a "Run workflow" button on the Actions tab for manual builds.
  workflow_dispatch:

# A newer push to the same branch or PR cancels its in-progress run, so only the latest commit gets
# published. Grouping by ref keeps PR runs from cancelling a publish on main.
concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the web image in docker/compose.yaml; GHCR names have to be lowercase.
  IMAGE: ghcr.io/jakejgm/stardropcafe-web

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      # Matches the Node version in docker/web.Dockerfile; caches npm downloads between runs.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # There are no unit tests yet; the build runs tsc, so it doubles as the type check.
      - name: Type-check and build
        run: npm run build

  build-and-push:
    # Only build (and publish) once the checks pass.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to GHCR

    steps:
      - uses: actions/checkout@v7

      # Pull requests don't push, so they don't need registry credentials.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU emulates arm64 so the image also runs natively on Apple Silicon. The Node build stage
      # runs on the host platform, so only the small nginx stage is emulated.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          # Pull requests only check that the image builds for both platforms.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Own scope so this cache doesn't overwrite the backend workflow's (both default to "buildkit").
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
