# Tests the backend, then builds its image and pushes it to GHCR, where docker/compose.yaml pulls it from.
# Pull requests run the same tests and build but never push, so a broken image can't be published.
name: Backend image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker/backend.Dockerfile'
      - '.github/workflows/backend-image.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker/backend.Dockerfile'
      - '.github/workflows/backend-image.yml'
  # Adds a "Run workflow" button on the Actions tab for manual builds.
  workflow_dispatch:

# A newer push to the same branch or PR cancels its in-progress run, so only the latest commit gets
# published. Grouping by ref keeps PR runs from cancelling a publish on main.
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the backend image in docker/compose.yaml; GHCR names have to be lowercase.
  IMAGE: ghcr.io/jakejgm/stardropcafe-backend

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # Matches the Java toolchain version in backend/build.gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle dependencies between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test

  build-and-push:
    # Only build (and publish) once the tests pass.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to GHCR

    steps:
      - uses: actions/checkout@v7

      # Pull requests don't push, so they don't need registry credentials.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU emulates arm64 so the image also runs natively on Apple Silicon.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          # Pull requests only check that the image builds for both platforms.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
